name: asura-sync

# Keep master identical to Void's, and merge it into Toren.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: asura-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Toren-Linux/void-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Which token
        env:
          BOT: ${{ secrets.ASURA_BOT_TOKEN }}
        run: |
          if [ -n "$BOT" ]; then
            echo "Using the ASURA_BOT_TOKEN secret."
          else
            echo "::warning::ASURA_BOT_TOKEN is not set (or not visible to this workflow): using GitHub's built-in token, which may not push here. See .asura/README.md."
          fi
      - uses: actions/checkout@v5
        with:
          ref: Toren
          # A token with the workflows permission: GitHub's built-in token
          # may not push commits that touch .github/workflows (every rebase
          # rewrites them), and pull requests it opens do not start other
          # workflows (Check build). See .asura/README.md.
          token: ${{ secrets.ASURA_BOT_TOKEN || github.token }}
          fetch-depth: 0
      - name: Merge Void's master into Toren
        run: |
          set -eu
          git config user.name "asura-sync"
          git config user.email "asura-sync@users.noreply.github.com"
          git remote add void https://github.com/void-linux/void-packages.git
          git fetch --no-tags void master
          new=$(git rev-parse void/master)
          # Void's master as this fork had it before: the soname watch looks
          # at what Void changed between the two.
          old=$(git rev-parse origin/master)
          echo "VOID_OLD=$old" >>"$GITHUB_ENV"
          echo "VOID_NEW=$new" >>"$GITHUB_ENV"
          # master stays an exact copy of Void's.
          if ! git push origin "$new:refs/heads/master"; then
            echo "::error::pushing master was refused: check that the ASURA_BOT_TOKEN secret exists and has Contents and Workflows read/write on this repository (see .asura/README.md)"
            exit 1
          fi
          if git merge-base --is-ancestor "$new" HEAD; then
            echo "Toren already has Void's newest master ($new)"
            exit 0
          fi
          # A merge, like GitHub's "Sync fork" button: history is never
          # rewritten, so nothing is force-pushed.
          if ! git merge --no-edit -m "Merge Void's master into Toren" void/master; then
            git merge --abort || true
            echo "::error::Void's master does not merge cleanly into Toren; resolve by hand (git merge void/master)"
            exit 1
          fi
          git push origin HEAD:Toren
          echo "merged Void's master ($new) into Toren"
      - name: Watch for soname bumps and open pull requests for affected stack packages
        env:
          GH_TOKEN: ${{ secrets.ASURA_BOT_TOKEN || github.token }}
        run: |
          python3 .asura/shlib-watch.py --old "$VOID_OLD" --new "$VOID_NEW" --commit --pr
